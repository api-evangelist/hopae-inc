aid: hopae-inc
name: Hopae, Inc.
description: >-
  Hopae, Inc. (Hopae S.A.) is a digital identity infrastructure company that connects
  verification providers, regulated businesses, and trust service providers to 65+
  government-backed electronic IDs (eIDs) worldwide through a single, compliant API.
  Its flagship product, hConnect, is a unified global eID verification hub exposing an
  OIDC OpenID Provider surface plus a REST API for provider discovery and the verification
  lifecycle. Hopae also ships an accredited eIDAS 2.0 wallet SDK, authored the widely used
  SD-JWT / SD-JWT-VC reference implementation (donated to the OpenWallet Foundation), and
  builds around open standards including eIDAS 2.0, mDL, SD-JWT, and W3C Verifiable
  Credentials. The platform is developer-first with sandbox and production environments,
  HMAC-signed webhooks, and a published SOC 2 / ISO 27001 / GDPR compliance posture.
