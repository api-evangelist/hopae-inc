note: >-
  Hopae's public libraries center on Verifiable Digital Credentials and wallets
  (SD-JWT, W3C DID/VC, hDCX wallet SDK). The @sd-jwt/* packages were created by
  Hopae and donated to the OpenWallet Foundation (marked official:false, community
  stewardship). The hConnect REST API itself is integrated over standard OIDC
  client libraries plus the React quickstart repo rather than a dedicated server SDK.
